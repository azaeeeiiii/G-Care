<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCare</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/report.css">

</head>
<body>

<header class="topbar">
  <a class="logo" href="#">GCare</a>
  <nav class="topnav" aria-label="Main">
    <a href="#">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT US</a>
  </nav>
</header>

<main>
  <!-- FEED SECTION -->
  <section class="view feed-view" id="feedView" aria-label="Community feed" hidden>
    <h1 class="sr-only">Community Feed</h1>
    <div class="feed-grid" id="feedGrid"></div>
  </section>

  <!-- NEWS DETAILS SECTION -->
  <section class="view news-details-view" id="newsDetailsView" aria-label="News details" hidden></section>

  <!-- MAP SECTION -->
  <section class="view panel" id="mapView" aria-label="Community map">
    <div id="map"></div>

    <div class="gch-area">
      <button class="chip" id="locationChip" type="button" title="Recenter map">
        <img src="images/golden_country_location.png" alt="">
        <span id="locationName">Golden Country Homes</span>
      </button>
    </div>

    <button class="locate-btn" id="locateBtn" type="button" aria-label="Use my current location">
      <img src="images/current_location.png" alt="Current Location">
    </button>
  </section>

  <!-- REPORT SECTION -->
  <section class="view report-view" id="reportView" aria-label="Report community news" hidden>
    <div class="report-header">
      <p class="report-eyebrow">COMMUNITY REPORT</p>
      <h1>Report News</h1>
      <p>Share an important update, concern, or event with the GCare community.</p>
    </div>

    <form class="report-form" id="reportForm">
      <div class="report-form-grid">
        <label>
          News title
          <input type="text" name="title" maxlength="90" placeholder="e.g. Road Closure Advisory" required>
        </label>

        <label>
          Category
          <select name="category" required>
            <option value="">Select a category</option>
            <option>WEATHER UPDATE</option>
            <option>COMMUNITY NEWS</option>
            <option>SAFETY TIPS</option>
            <option>LOCAL UPDATE</option>
            <option>VOLUNTEER NEWS</option>
            <option>GCARE REMINDER</option>
          </select>
        </label>

        <label>
          Location
          <input type="text" name="location" maxlength="100" placeholder="e.g. Golden Country Homes" required>
        </label>

        <label>
          Reported by
          <input type="text" name="source" maxlength="80" placeholder="Your name or group" required>
        </label>
      </div>

      <label>
        Short summary
        <textarea name="body" maxlength="220" rows="3" placeholder="Write a short summary for the feed card." required></textarea>
      </label>

      <label>
        Full details
        <textarea name="details" maxlength="1200" rows="6" placeholder="Explain what happened, when, and what the community should know." required></textarea>
      </label>

      <label>
        Photo <span class="report-optional">(optional)</span>
        <input type="file" name="image" accept="image/*">
      </label>

      <p class="report-status" id="reportStatus" role="status" aria-live="polite"></p>
      <button class="report-submit" type="submit">Publish to Community Feed</button>
    </form>
  </section>

  <!-- VOLUNTEER SECTION -->
  <section class="view" id="volunteerView" hidden>
    <h1>Volunteer</h1>
    <p>Discover ways to help your community.</p>
  </section>

  <!-- PROFILE SECTION -->
  <section class="view" id="profileView" hidden>
    <h1>My Profile</h1>
    <p>View your account information here.</p>
  </section>
</main>

<nav class="bottomnav" aria-label="App sections">
  <button class="tab" data-view="feed">
    <img src="images/feed.png" alt="Feed">
    Feed
  </button>

  <button class="tab" data-view="map" aria-current="page">
    <img src="images/map.png" alt="Map"> 
    Map
  </button>

  <button class="tab" data-view="report">
    <img src="images/report.png" alt="Report">
    Report
  </button>

  <button class="tab" data-view="volunteer">
    <img src="images/volunteer.png" alt="Volunteer">
    Volunteer
  </button>

  <button class="tab" data-view="profile">
    <img src="images/profile.png" alt="Profile">
    Profile
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script src="js/script.js"></script>
<script src="js/feed.js"></script>
<script src="js/report.js"></script>
<script src="js/map.js"></script>
</body>
</html>
